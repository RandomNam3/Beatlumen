[package]
name = "bl-vault"
description = "End-to-end encryption of user files: keys, encrypted file format, sharing (see docs/ENCRYPTION.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Cryptography from the RustCrypto project, pinned exactly; updates are
# deliberate (see docs/ENCRYPTION.md).
[dependencies]
bl-json = { path = "../bl-json" }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = { version = "=0.2.17", features = ["std"] }
hkdf = { version = "=0.12.4", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa", "std"] }
sha2 = { version = "=0.10.9", default-features = false }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", default-features = false, features = ["zeroize_derive"] }
