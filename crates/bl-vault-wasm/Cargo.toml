[package]
name = "bl-vault-wasm"
description = "bl-vault for the browser sign-in page (WebAssembly, plain C ABI, no JavaScript bindings)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bl-vault = { path = "../bl-vault" }
bl-json = { path = "../bl-json" }

# The browser's crypto.getRandomValues for getrandom on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
