[package]
name = "bl-core"
description = "Platform independent Beatlumen core: playback, library, effects and visualizer, driven by a JSON command API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bl-json = { path = "../bl-json" }
bl-media = { path = "../bl-media" }
bl-image = { path = "../bl-image" }
bl-analysis = { path = "../bl-analysis" }
bl-recommend = { path = "../bl-recommend" }
bl-meta = { path = "../bl-meta" }
bl-fx = { path = "../bl-fx" }
bl-gl = { path = "../bl-gl" }
bl-render = { path = "../bl-render" }
bl-net = { path = "../bl-net" }
bl-airplay = { path = "../bl-airplay" }
bl-vault = { path = "../bl-vault" }
bl-offline = { path = "../bl-offline" }
# Karaoke tracks (notes, UltraStar files).
bl-pitch = { path = "../bl-pitch" }

# Speakers that fetch a stream from the app (not in the browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bl-upnp = { path = "../bl-upnp" }
bl-cast = { path = "../bl-cast" }
# Music sources the app uses without a server.
bl-sources = { path = "../bl-sources" }
# Speech recognition on the device (song text timing).
bl-align = { path = "../bl-align" }
bl-asr = { path = "../bl-asr", features = ["gpu"] }
# Translating song texts on the device.
bl-mt = { path = "../bl-mt" }
# Karaoke data computed on the device (separated vocals, melody).
bl-karaoke = { path = "../bl-karaoke" }
bl-sep = { path = "../bl-sep" }
