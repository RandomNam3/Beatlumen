[package]
name = "bl-asr"
description = "Speech recognition (Whisper models in ggml format), for synced song texts"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The audio encoder on the GPU (Vulkan, loaded at run time; the CPU
# computes when there is none).
gpu = ["dep:bl-gpu"]

[dependencies]
bl-json = { path = "../bl-json" }
# Syllables of sung words.
bl-hyph = { path = "../bl-hyph" }
bl-gpu = { path = "../bl-gpu", optional = true }

# Model downloads (not in the browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bl-net = { path = "../bl-net" }

[dev-dependencies]
# The examples time words with an alignment model too.
bl-align = { path = "../bl-align" }
