[workspace]
resolver = "2"
members = ["crates/*", "apps/beatlumen-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/RandomNam3/Beatlumen"
rust-version = "1.80"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
