[workspace]
resolver = "2"
members = ["crates/*", "apps/beatlumen-server"]

[workspace.package]
version = "0.13.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/RandomNam3/Beatlumen"
# 1.81: a panic that reaches the C interface aborts instead of being
# undefined behaviour (the app catches them before); 1.82: Option::is_none_or.
rust-version = "1.82"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

# Parsers of files and data from outside: an arithmetic overflow becomes a
# caught panic instead of a wrong size or index. Measured on 2026-11-08
# (best of 5, with and without): decoding FLAC, MP3, AAC, Opus and Vorbis,
# parsing 24 MB of JSON and pitch tracking stay within 1.2 %. bl-image is
# left out: JPEG decoding took 11 % longer and scaling 74 %.
[profile.release.package.bl-media]
overflow-checks = true
[profile.release.package.bl-json]
overflow-checks = true
[profile.release.package.bl-ogg]
overflow-checks = true
[profile.release.package.bl-sources]
overflow-checks = true
[profile.release.package.bl-upnp]
overflow-checks = true
[profile.release.package.bl-cast]
overflow-checks = true
[profile.release.package.bl-airplay]
overflow-checks = true
[profile.release.package.bl-pitch]
overflow-checks = true
[profile.release.package.bl-net]
overflow-checks = true

# The server's database: small amounts of data, so size over speed.
[profile.release.package.redb]
opt-level = "s"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
