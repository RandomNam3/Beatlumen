[package]
name = "beatlumen-server"
description = "Beatlumen music library server (serves local music folders to Beatlumen clients over HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "beatlumen_server"
path = "src/lib.rs"

[[bin]]
name = "beatlumen-server"
path = "src/main.rs"

[dependencies]
bl-net = { path = "../../crates/bl-net" }
bl-json = { path = "../../crates/bl-json" }
bl-media = { path = "../../crates/bl-media" }
bl-image = { path = "../../crates/bl-image" }
bl-analysis = { path = "../../crates/bl-analysis" }
bl-fx = { path = "../../crates/bl-fx" }
bl-vault = { path = "../../crates/bl-vault" }
# TLS for outgoing connections (push services); pinned exactly.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
# Passkey signatures (ES256, EdDSA, RS256); already used by rustls.
ring = "=0.17.14"

[dev-dependencies]
bl-core = { path = "../../crates/bl-core" }
bl-airplay = { path = "../../crates/bl-airplay" }
bl-cast = { path = "../../crates/bl-cast" }
bl-upnp = { path = "../../crates/bl-upnp" }
# A software authenticator for the passkey tests.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
