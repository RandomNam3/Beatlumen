[package]
name = "openchroma-server"
description = "OpenChroma music library server (serves local music folders to OpenChroma clients over HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "openchroma_server"
path = "src/lib.rs"

[[bin]]
name = "openchroma-server"
path = "src/main.rs"

[dependencies]
oc-net = { path = "../../crates/oc-net" }
oc-json = { path = "../../crates/oc-json" }
oc-media = { path = "../../crates/oc-media" }
oc-image = { path = "../../crates/oc-image" }
oc-analysis = { path = "../../crates/oc-analysis" }
oc-fx = { path = "../../crates/oc-fx" }
