<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0a10">
  <title>Beatlumen – Sign in</title>
  <!-- SHA-256 of vault.wasm, filled in by finish.sh. -->
  <meta name="beatlumen-vault-wasm" content="">
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main>
    <header>
      <img src="../icon.png" width="48" height="48" alt="">
      <h1 data-t="Sign in">Sign in</h1>
    </header>

    <section id="pairing" class="note" hidden>
      <p data-t="Check that the app shows this code:">Check that the app shows this code:</p>
      <p id="code" class="code"></p>
    </section>

    <section id="signin" hidden>
      <button id="passkey" class="primary" type="button" data-t="Sign in with a passkey">Sign in with a passkey</button>
      <p class="or" data-t="or with your password">or with your password</p>
      <form id="pwform" autocomplete="on">
        <label><span data-t="User name">User name</span>
          <input id="user" name="username" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" required></label>
        <label><span data-t="Password">Password</span>
          <input id="pw" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" data-t="Sign in">Sign in</button>
      </form>
    </section>

    <section id="manage" hidden>
      <h2 data-t="Passkeys">Passkeys</h2>
      <p class="hint" data-t="A passkey unlocks your encrypted files without a password, on this device or your phone.">A passkey unlocks your encrypted files without a password, on this device or your phone.</p>
      <ul id="keys"></ul>
      <form id="addform">
        <label><span data-t="Name of the new passkey">Name of the new passkey</span>
          <input id="keyname" maxlength="64" autocomplete="off"></label>
        <button type="submit" class="primary" data-t="Add passkey">Add passkey</button>
      </form>
      <h2 data-t="Password">Password</h2>
      <p id="pwstate" class="hint"></p>
      <button id="pwoff" type="button" hidden data-t="Turn the password off">Turn the password off</button>
      <form id="pwon" hidden autocomplete="on">
        <input name="username" autocomplete="username" hidden>
        <label><span data-t="New password">New password</span>
          <input id="newpw" type="password" autocomplete="new-password" minlength="10" required></label>
        <label><span data-t="Repeat password">Repeat password</span>
          <input id="newpw2" type="password" autocomplete="new-password" minlength="10" required></label>
        <button type="submit" data-t="Set password">Set password</button>
      </form>
      <button id="done" type="button" data-t="Sign out">Sign out</button>
    </section>

    <section id="finished" hidden>
      <p id="finishedText" class="note"></p>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
